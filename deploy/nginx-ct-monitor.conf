# ct-monitor 反向代理样例 — /etc/nginx/sites-available/ct-monitor.conf
#
# 站点本身零秘密（爬取逻辑全部在服务端），浏览器到 nginx 这一段
# 由应用内置的 Basic 认证把关（CT_AUTH_USER / CT_AUTH_PASSWORD）。
# API 强制 127.0.0.1:8000，绝不对公网开放 8000 端口。

server {
    listen 80;
    server_name _;

    # 应用层已把请求体限制在 64 KiB，这里给一点余量
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live-check 要当场穿透 WAF 访问登记平台，慢请求是常态
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 以后绑定了域名想上 HTTPS：
#   apt install certbot python3-certbot-nginx && certbot --nginx -d 你的域名
# certbot 会自动改写这个文件。
